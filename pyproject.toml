[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "brepkernel"
version = "0.9.0"
description = "Robust B-rep booleans prototype: exact trimmed-B-rep pipeline that never silently returns a broken solid"
readme = "README.md"
requires-python = ">=3.12"
license = {text = "MIT"}
dependencies = [
    "numpy>=1.26",
    "manifold3d>=3.0",
    "cadquery-ocp>=7.8.1.1,<8.1",
]

[project.optional-dependencies]
test = []
freeform = []

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
brepkernel = ["py.typed"]
