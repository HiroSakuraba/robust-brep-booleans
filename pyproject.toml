[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "brepkernel"
version = "0.9.0"
description = "Robust B-rep booleans prototype: exact trimmed-B-rep pipeline that never silently returns a broken solid"
readme = "README.md"
requires-python = ">=3.12"
license = {text = "MIT"}
dependencies = [
    "numpy>=1.26",
    "manifold3d>=3.0",
    "cadquery-ocp>=7.8.1.1,<8.1",
]

[project.scripts]
brepkernel = "brepkernel.cli:main"

[project.optional-dependencies]
test = ["pytest>=8"]
freeform = []
# Optional second engine and USD import/export checks: NVIDIA usd-brep
# (SMLib, Apache-2.0). Wheels are CPython 3.12. brepkernel.usd's .usda
# writer and reader work without it.
usd = ["usd-brep>=1.0"]
# Certified convex collision pieces for extruded parts (brepkernel.convex_pieces).
collision = ["scipy>=1.10", "shapely>=2.0"]
# MuJoCo collision geometry through mjfit (MIT): certify its peg-in-hole models
# and build them from CAD plates (brepkernel.mujoco_fit).
mjfit = [
    "mjfit @ git+https://github.com/younghyopark/mjfit@eee986cc087d14458337fdc195d5cf03abc6aa6d",
    "scipy>=1.10",
    "shapely>=2.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
brepkernel = ["py.typed"]
