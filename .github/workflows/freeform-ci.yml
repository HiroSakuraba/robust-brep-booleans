name: Freeform NURBS CI

on:
  push:
    branches:
      - main
  pull_request:
    paths:
      - "src/brepkernel/freeform.py"
      - "src/brepkernel/step_ingest.py"
      - "src/brepkernel/intersection.py"
      - "src/brepkernel/split.py"
      - "src/brepkernel/assembly.py"
      - "tests/test_freeform_nurbs.py"
      - "tests/test_freeform_intersection.py"
      - "tests/test_freeform_split.py"
      - "tests/test_freeform_assembly.py"
      - "tests/test_nurbs_boolean_end_to_end.py"
      - "docs/NURBS_ACCEL.md"
      - ".github/workflows/freeform-ci.yml"

concurrency:
  group: freeform-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  freeform:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install geometry dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install numpy manifold3d cadquery-ocp
      - name: NURBS evaluator / broadphase regressions
        run: python tests/test_freeform_nurbs.py
      - name: Trimmed surface intersection regressions
        run: python tests/test_freeform_intersection.py
      - name: Local face split regressions
        run: python tests/test_freeform_split.py
      - name: Global B-rep assembly regressions
        run: python tests/test_freeform_assembly.py
      - name: True NURBS end-to-end Boolean regression
        run: python tests/test_nurbs_boolean_end_to_end.py
      - name: Multi-shell semantic regressions
        run: python tests/test_multishell_semantics.py
