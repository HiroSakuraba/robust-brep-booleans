name: Tier A CI

on:
  push:
    branches:
      - main
  pull_request:
    paths:
      - "src/brepkernel/**"
      - "tests/test_stress.py"
      - "tests/test_metamorphic.py"
      - "tests/test_degenerate.py"
      - "tests/test_regression.py"
      - "tools/review_probes/**"
      - "requirements-freeform.txt"
      - ".github/workflows/tierA-ci.yml"

concurrency:
  group: tiera-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tiera:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: requirements-freeform.txt
      - name: Install geometry dependencies
        run: python -m pip install -r requirements-freeform.txt
      - name: Metamorphic Tier A tests
        run: python tests/test_metamorphic.py
      - name: Degenerate-case Tier A tests
        run: python tests/test_degenerate.py
      - name: Regression Tier A tests
        run: python tests/test_regression.py
      - name: Stress Tier A tests
        run: python tests/test_stress.py
      - name: CAD probes baseline (fail on wrong answers only)
        run: python tools/review_probes/common_cad_probes.py --baseline
      - name: Short fuzz run (fail on WRONG or CRASH)
        run: python tools/review_probes/fuzz_brep.py --trials 30 --seed 7 --out /tmp/tiera_fuzz.json
