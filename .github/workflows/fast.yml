name: Fast PR matrix

# G18b: complete fast matrix.  Python 3.12 on OCP 8.0.1 and 7.8.1.
# Every fast tests/test_*.py file runs; only the explicit slow list
# (test_g7_seam_stress.py, test_stress.py) is nightly-only.

on:
  push:
    branches:
      - main
  pull_request:
    paths:
      - "src/brepkernel/**"
      - "tests/**"
      - "tools/review_probes/**"
      - "requirements-freeform.txt"
      - "pyproject.toml"
      - ".github/workflows/fast.yml"

concurrency:
  group: fast-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  fast:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        ocp:
          - cadquery-ocp==8.0.1.0.0
          - cadquery-ocp==7.8.1.1.post1
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: requirements-freeform.txt
      - name: Install dependencies
        run: >-
          python -m pip install
          numpy==2.5.3 manifold3d==3.5.3
          "${{ matrix.ocp }}" -e .[test]
      - name: Fast tests (every test file except the nightly slow list)
        run: |
          set -e
          # pytest-style files (import pytest at module level) run under
          # pytest; the rest are self-contained scripts.
          pytest_files=$(grep -l "^import pytest" tests/test_*.py || true)
          for t in tests/test_*.py; do
            case "$t" in
              tests/test_g7_seam_stress.py|tests/test_stress.py) continue ;;
            esac
            case " $pytest_files " in
              *" $t "*) continue ;;
            esac
            echo "=== $t ==="
            python "$t"
          done
          if [ -n "$pytest_files" ]; then
            echo "=== pytest: $pytest_files ==="
            # shellcheck disable=SC2086
            python -m pytest $pytest_files -q
          fi
      - name: "CAD probes, strict (wrong answers and unmet expected accepts fail)"
        run: python tools/review_probes/common_cad_probes.py
      - name: Short deterministic fuzz (fail on WRONG or CRASH)
        run: python tools/review_probes/fuzz_brep.py --trials 30 --seed 7 --out /tmp/fast_fuzz.json
